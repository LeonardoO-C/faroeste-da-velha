<title>Faroeste da Velha</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rye&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
/* Layout: uma coluna estreita como um cartaz de "procurado", tabuleiro de tábua no centro, placas dos pistoleiros em cima. */
:root {
  color-scheme: dark;
  --dusk: #1f130d;          /* fundo: entardecer na serra */
  --dusk-2: #3a2216;
  --wood: #9a6a3f;          /* tábua da porteira */
  --wood-dark: #5e3b21;
  --paper: #efdfbf;         /* papel de cartaz */
  --ink: #2a190f;
  --brass: #e0a93f;         /* Xerife (X) e destaque */
  --rust: #d0533a;          /* Bandido (O) */
  --muted: #b89c7a;
  --hole: #140b06;
  --display: "Rye", "Rockwell", Georgia, serif;
  --body: "Alegreya Sans", "Trebuchet MS", system-ui, sans-serif;
}
html, body { height: 100%; }
body {
  background: radial-gradient(120% 70% at 50% 0%, #6b3a1e 0%, var(--dusk-2) 35%, var(--dusk) 75%) fixed, var(--dusk);
  color: var(--paper);
  font-family: var(--body);
  font-size: 16px;
  -webkit-tap-highlight-color: transparent;
}
.app {
  min-height: 100%;
  max-width: 560px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 24px;
  display: flex; flex-direction: column; gap: 16px;
}
h1, h2, .display { font-family: var(--display); font-weight: 400; letter-spacing: .01em; text-wrap: balance; margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }

/* ---------- Menu ---------- */
.poster {
  background: var(--paper); color: var(--ink);
  border-radius: 4px; padding: 22px 18px 20px;
  box-shadow: 0 18px 40px rgba(0,0,0,.45), inset 0 0 60px rgba(120,70,20,.25);
  display: flex; flex-direction: column; gap: 18px;
  position: relative;
}
.poster::before, .poster::after { content: ""; position: absolute; top: 10px; width: 10px; height: 10px; border-radius: 50%; background: #6d5038; box-shadow: inset 0 1px 2px rgba(0,0,0,.6); }
.poster::before { left: 10px; } .poster::after { right: 10px; }
.poster h1 { font-size: clamp(2.1rem, 9vw, 3rem); line-height: 1; text-align: center; color: var(--ink); }
.poster .tag { text-align: center; font-size: .78rem; letter-spacing: .22em; text-transform: uppercase; color: #7a5534; margin-top: -8px; }
.field { display: flex; flex-direction: column; gap: 8px; }
.field > span { font-size: .75rem; letter-spacing: .16em; text-transform: uppercase; font-weight: 700; color: #7a5534; }
.seg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.seg.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.seg button {
  border: 2px solid #b6976d; background: transparent; border-radius: 4px;
  padding: 10px 8px; color: var(--ink); font-weight: 700; line-height: 1.15; text-align: left;
}
.seg button small { display: block; font-weight: 500; font-size: .78rem; color: #6c4c30; margin-top: 2px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.seg button[aria-pressed="true"] small { color: var(--muted); }
.cta {
  border: 0; border-radius: 4px; padding: 14px 16px;
  background: var(--rust); color: #fff4e4; font-family: var(--display); font-size: 1.35rem;
  box-shadow: 0 4px 0 #7d2c1c;
}
.cta:active { transform: translateY(2px); box-shadow: 0 2px 0 #7d2c1c; }
.cta.ghost { background: transparent; color: var(--paper); box-shadow: inset 0 0 0 2px var(--muted); font-family: var(--body); font-weight: 700; font-size: 1rem; }
.note { font-size: .82rem; color: var(--muted); text-align: center; line-height: 1.4; }

/* ---------- Duelo (Pedra, Papel e Tesoura) ---------- */
.duel { display: flex; flex-direction: column; gap: 18px; align-items: stretch; text-align: center; }
.duel h2 { font-size: 1.9rem; color: var(--brass); }
.duel p { margin: 0; color: var(--muted); }
.standoff { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.gunman { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.gunman .who { font-family: var(--display); font-size: 1.1rem; }
.gunman.x .who { color: var(--brass); } .gunman.o .who { color: var(--rust); }
.hand { width: 92px; height: 92px; display: grid; place-items: center; font-size: 3rem; border-radius: 50%; background: rgba(0,0,0,.3); border: 2px dashed var(--muted); transition: transform .2s; }
.hand.shown { border-style: solid; transform: scale(1.08); }
.vs { font-family: var(--display); font-size: 1.4rem; color: var(--muted); }
.count { font-family: var(--display); font-size: 2.4rem; min-height: 3rem; color: var(--paper); }
.hands { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.hands button { border: 2px solid var(--muted); background: rgba(0,0,0,.25); border-radius: 6px; padding: 12px 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 700; }
.hands button span { font-size: 2.2rem; }
.hands button:disabled { opacity: .35; cursor: default; }
.pickbar { height: 6px; background: rgba(0,0,0,.35); border-radius: 3px; overflow: hidden; }
.pickbar i { display: block; height: 100%; background: var(--brass); width: 100%; }

/* ---------- Partida ---------- */
.hud { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 10px; align-items: stretch; }
.plate { background: rgba(0,0,0,.28); border-radius: 6px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; border: 2px solid transparent; min-width: 0; }
.plate.active { border-color: currentColor; }
.plate.x { color: var(--brass); } .plate.o { color: var(--rust); text-align: right; }
.plate .name { font-family: var(--display); font-size: 1.05rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.plate .clock { font-variant-numeric: tabular-nums; font-weight: 800; color: var(--paper); font-size: .95rem; }
.fuse { height: 6px; border-radius: 3px; background: rgba(255,255,255,.08); position: relative; }
.fuse i { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: repeating-linear-gradient(90deg, #c9a46a 0 6px, #a9824a 6px 9px); }
.plate.o .fuse i { left: auto; right: 0; }
.fuse b { position: absolute; top: 50%; width: 10px; height: 10px; margin: -5px; border-radius: 50%; background: #ffd27a; box-shadow: 0 0 8px 3px #ff9c2a; opacity: 0; }
.plate.active .fuse b { opacity: 1; animation: spark .25s infinite alternate; }
.plate.low .fuse b { box-shadow: 0 0 14px 6px #ff5a1f; }
@keyframes spark { from { transform: scale(.7); } to { transform: scale(1.2); } }
.score { display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: var(--display); font-size: 1.3rem; color: var(--paper); font-variant-numeric: tabular-nums; }
.score small { font-family: var(--body); font-size: .68rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.status { text-align: center; font-weight: 700; min-height: 1.4em; color: var(--paper); }

.table { position: relative; }
.board {
  --n: 3;
  display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: var(--gap, 6px);
  padding: var(--gap, 6px); border-radius: 6px;
  background: var(--wood-dark);
  box-shadow: 0 14px 30px rgba(0,0,0,.5);
  aspect-ratio: 1; max-width: 100%;
}
.cell {
  position: relative; border: 0; padding: 0; border-radius: 2px;
  background:
    repeating-linear-gradient(90deg, rgba(0,0,0,.06) 0 2px, transparent 2px 13px),
    linear-gradient(180deg, #a87447, var(--wood));
  box-shadow: inset 0 -2px 0 rgba(0,0,0,.18), inset 0 1px 0 rgba(255,230,190,.2);
  aspect-ratio: 1; min-width: 0;
}
.cell:not(:disabled):hover { filter: brightness(1.12); }
.cell:disabled { cursor: default; }
.cell svg { position: absolute; inset: 8%; width: 84%; height: 84%; overflow: visible; }
.board.dense .cell svg { inset: 0; width: 100%; height: 100%; }
.cell.shot svg { animation: hit .35s cubic-bezier(.2,1.6,.4,1); }
.cell.shot::after { content: ""; position: absolute; inset: 20%; border-radius: 50%; background: radial-gradient(circle, #fff6c8 0, #ffb347 35%, transparent 70%); animation: flash .3s ease-out forwards; pointer-events: none; }
.cell.win { background: linear-gradient(180deg, #c79a5a, #b07a43); }
.cell.win svg { animation: volley .5s ease-in-out infinite alternate; }
@keyframes hit { from { transform: scale(1.6); opacity: .2; } to { transform: scale(1); opacity: 1; } }
@keyframes flash { from { opacity: 1; transform: scale(.6); } to { opacity: 0; transform: scale(1.8); } }
@keyframes volley { from { transform: scale(1); } to { transform: scale(1.12) rotate(-3deg); } }
.board.shake { animation: shake .18s; }
@keyframes shake { 25% { transform: translate(3px, -2px); } 50% { transform: translate(-3px, 2px); } 75% { transform: translate(2px, 1px); } }
.last-o::before, .last-x::before { content: ""; position: absolute; inset: -2px; border-radius: 3px; box-shadow: 0 0 0 2px var(--paper); opacity: .55; pointer-events: none; }

/* Ultimate */
.ult { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; padding: 10px; background: #3d2614; border-radius: 8px; aspect-ratio: 1; max-width: 100%; box-shadow: 0 14px 30px rgba(0,0,0,.5); }
.ult .board { --gap: 3px; box-shadow: none; position: relative; transition: box-shadow .2s, opacity .2s; }
.ult .board.live { box-shadow: 0 0 0 3px var(--brass), 0 0 18px rgba(224,169,63,.5); }
.ult .board.idle { opacity: .55; }
.ult .board .big { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(31,19,13,.55); border-radius: 6px; pointer-events: none; }
.ult .board .big svg { width: 80%; height: 80%; }
.ult .board.wonline .big { background: rgba(224,169,63,.25); }

/* Resultado */
.overlay { position: fixed; inset: 0; background: rgba(20,11,6,.72); display: grid; place-items: center; padding: 16px; z-index: 5; }
.overlay .poster { width: min(420px, 100%); text-align: center; }
.overlay h2 { font-size: 2rem; color: var(--ink); }
.overlay p { margin: 0; color: #5b3d24; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > * { flex: 1 1 140px; }
.poster .cta.ghost { color: var(--ink); box-shadow: inset 0 0 0 2px #b6976d; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.topbar .display { font-size: 1.15rem; color: var(--brass); }
.link { background: none; border: 0; color: var(--muted); font-weight: 700; padding: 6px 4px; text-decoration: underline; text-underline-offset: 3px; }

.invite { width: 100%; font: inherit; font-size: .85rem; padding: 10px; border-radius: 4px; border: 2px solid var(--muted); background: rgba(0,0,0,.3); color: var(--paper); }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<div class="app" id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>/*ENGINE*/</script>
<script>
(() => {
const E = window.FaroesteEngine;
const $app = document.getElementById('app');

// ---------- Configuração ----------
const MODES = {
  classico:  { label: 'Clássico',  sub: '3x3 · melhor de 3', secs: 60,  kind: 'line', mode: E.MODES.classico },
  estendido: { label: 'Estendido', sub: '5x5 · 4 em linha',  secs: 120, kind: 'line', mode: E.MODES.estendido },
  ultimate:  { label: 'Ultimate',  sub: '9 tabuleiros',      secs: 180, kind: 'ult' },
  gomoku:    { label: 'Gomoku',    sub: '15x15 · 5 em linha', secs: 300, kind: 'line', mode: E.MODES.gomoku },
};
const LEVELS = { facil: 'Fácil', medio: 'Médio', dificil: 'Difícil' };
const HAND_ICON = { pedra: '✊', papel: '✋', tesoura: '✌️' };
const HAND_LABEL = { pedra: 'Pedra', papel: 'Papel', tesoura: 'Tesoura' };

const store = {
  get(k, d) { try { const v = localStorage.getItem('fdv-' + k); return v ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('fdv-' + k, v); } catch {} },
};
const cfg = {
  mode: store.get('mode', 'classico'),
  level: store.get('level', 'medio'),
  vs: store.get('vs', 'bot'),
  sound: store.get('sound', '1') === '1',
};
if (!MODES[cfg.mode]) cfg.mode = 'classico';

const names = () => {
  if (S && S.online) return S.you === 'X' ? { X: 'Você', O: 'Adversário' } : { X: 'Adversário', O: 'Você' };
  return cfg.vs === 'bot' ? { X: 'Você', O: 'Bandido' } : { X: 'Xerife', O: 'Bandido' };
};

// ---------- Som (estampido sintetizado) ----------
let ctx = null;
function audio() { if (!cfg.sound) return null; try { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; } return ctx; }
function bang(big = false) {
  const a = audio(); if (!a) return;
  const len = a.sampleRate * (big ? .6 : .32);
  const buf = a.createBuffer(1, len, a.sampleRate); const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, big ? 2.5 : 4);
  const src = a.createBufferSource(); src.buffer = buf;
  const f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = big ? 1400 : 2400;
  const g = a.createGain(); g.gain.value = big ? .9 : .6;
  src.connect(f).connect(g).connect(a.destination); src.start();
}
function tick() {
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.frequency.value = 880; g.gain.setValueAtTime(.15, a.currentTime); g.gain.exponentialRampToValueAtTime(.001, a.currentTime + .08);
  o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime + .09);
}
function buzz(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch {} }

// ---------- Marcas de tiro (SVG) ----------
function holeSvg(cx, cy, r) {
  return `<circle cx="${cx}" cy="${cy}" r="${r * 1.7}" fill="rgba(255,225,170,.28)"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="var(--hole)"/>
    <circle cx="${cx - r * .3}" cy="${cy - r * .3}" r="${r * .35}" fill="#000"/>`;
}
function markSvg(p) {
  if (p === 'X') {
    return `<svg viewBox="0 0 100 100" aria-hidden="true">
      <path d="M18 18 L82 82 M82 18 L18 82" stroke="var(--brass)" stroke-width="13" stroke-linecap="round"/>
      <path d="M18 18 L82 82 M82 18 L18 82" stroke="#fff2c9" stroke-width="3" stroke-linecap="round" opacity=".55"/>
      ${holeSvg(50, 50, 9)}</svg>`;
  }
  let holes = '';
  for (let i = 0; i < 6; i++) { const t = i / 6 * Math.PI * 2 - Math.PI / 2; holes += holeSvg(50 + Math.cos(t) * 31, 50 + Math.sin(t) * 31, 6); }
  return `<svg viewBox="0 0 100 100" aria-hidden="true">
    <circle cx="50" cy="50" r="31" fill="none" stroke="var(--rust)" stroke-width="11"/>${holes}</svg>`;
}

// ---------- Estado geral ----------
let S = null; // partida em andamento
let timer = null;
const clear = () => { if (timer) { clearInterval(timer); timer = null; } };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const isBot = (p) => !(S && S.online) && cfg.vs === 'bot' && p === 'O';

// ---------- Menu ----------
function seg(key, opts, cls = '') {
  return `<div class="seg ${cls}" role="group">` + Object.entries(opts).map(([k, v]) =>
    `<button type="button" id="opt-${key}-${k}" data-k="${key}" data-v="${k}" aria-pressed="${cfg[key] === k}">${typeof v === 'object' ? v.label + `<small>${v.sub}</small>` : v}</button>`).join('') + '</div>';
}
function menu() {
  clear(); S = null;
  $app.innerHTML = `
    <div class="poster">
      <h1>Faroeste da Velha</h1>
      <div class="tag">Jogo da velha no gatilho</div>
      <div class="field"><span>Modo</span>${seg("mode", MODES)}</div>
      <div class="field"><span>Adversário</span>${seg('vs', { bot: { label: 'Contra o bot', sub: 'Você é o Xerife' }, local: { label: 'Dois jogadores', sub: 'No mesmo celular' }, online: { label: 'Online', sub: 'Convide um amigo' } })}</div>
      <div class="field" id="lvl" ${cfg.vs === 'bot' ? '' : 'hidden'}><span>Pontaria do bot</span>${seg('level', LEVELS, 'three')}</div>
      <button class="cta" id="go" type="button">Sacar o revólver</button>
    </div>
    <p class="note">Protótipo para testar a diversão. Antes de cada partida, um duelo de Pedra, Papel e Tesoura decide quem atira primeiro.</p>
    <button class="link" id="snd" type="button">Som: ${cfg.sound ? 'ligado' : 'desligado'}</button>`;
  $app.querySelectorAll('.seg button').forEach((b) => b.onclick = (e) => {
    e.preventDefault();
    cfg[b.dataset.k] = b.dataset.v; store.set(b.dataset.k, b.dataset.v); menu();
    document.getElementById(b.id)?.focus();
  });
  document.getElementById('snd').onclick = () => { cfg.sound = !cfg.sound; store.set('sound', cfg.sound ? '1' : '0'); menu(); };
  document.getElementById('go').onclick = () => { audio(); cfg.vs === 'online' ? Online.create(cfg.mode) : startSeries(); };
}

// ---------- Série ----------
function startSeries() {
  S = { modeKey: cfg.mode, conf: MODES[cfg.mode], wins: { X: 0, O: 0 }, games: 0, starter: null };
  duel();
}

// ---------- Duelo de Pedra, Papel e Tesoura ----------
function duel() {
  clear();
  const n = names();
  let rps = E.newRps();
  let picks = { X: null, O: null };
  let picking = cfg.vs === 'bot' ? 'X' : 'X';

  $app.innerHTML = `
    <div class="topbar"><button class="link" id="back" type="button">Voltar</button><span class="display">${S.conf.label}</span></div>
    <div class="duel">
      <h2>Duelo ao meio-dia</h2>
      <p id="dmsg"></p>
      <div class="standoff">
        <div class="gunman x"><div class="hand" id="hx">?</div><div class="who">${n.X}</div></div>
        <div class="vs">x</div>
        <div class="gunman o"><div class="hand" id="ho">?</div><div class="who">${n.O}</div></div>
      </div>
      <div class="count" id="count"></div>
      <div class="pickbar"><i id="pbar"></i></div>
      <div class="hands" id="hands">${E.HANDS.map((h) => `<button type="button" id="hand-${h}" data-h="${h}"><span>${HAND_ICON[h]}</span>${HAND_LABEL[h]}</button>`).join('')}</div>
      <button class="cta" id="begin" type="button" hidden>Começar</button>
    </div>`;
  document.getElementById('back').onclick = menu;
  const $msg = document.getElementById('dmsg'), $count = document.getElementById('count'), $bar = document.getElementById('pbar');
  const $hands = [...document.querySelectorAll('#hands button')];
  const setHands = (on) => $hands.forEach((b) => b.disabled = !on);

  let deadline = 0;
  function askPick() {
    const who = n[picking];
    $msg.textContent = cfg.vs === 'bot' ? 'Escolha sua mão. Você tem 5 segundos.'
      : `${who}, escolha sem o outro ver. 5 segundos.`;
    setHands(true);
    deadline = performance.now() + 5000;
    clear();
    timer = setInterval(() => {
      const left = Math.max(0, deadline - performance.now());
      $bar.style.width = (left / 50) + '%';
      if (left <= 0) choose(E.randomHand());
    }, 50);
  }
  function choose(h) {
    clear(); setHands(false);
    picks[picking] = h;
    if (cfg.vs === 'bot') { picks.O = E.randomHand(); return reveal(); }
    if (picking === 'X') { picking = 'O'; $msg.textContent = `Passe o celular para o ${n.O}.`; setTimeout(askPick, 900); return; }
    reveal();
  }
  $hands.forEach((b) => b.onclick = () => choose(b.dataset.h));

  async function reveal() {
    const hx = document.getElementById('hx'), ho = document.getElementById('ho');
    hx.textContent = ho.textContent = '?'; hx.classList.remove('shown'); ho.classList.remove('shown');
    $msg.textContent = '';
    for (const w of ['Um…', 'Dois…', 'Três!']) { $count.textContent = w; tick(); await sleep(420); }
    bang();
    hx.textContent = HAND_ICON[picks.X]; ho.textContent = HAND_ICON[picks.O];
    hx.classList.add('shown'); ho.classList.add('shown');
    rps = E.playRpsRound(rps, picks.X, picks.O);
    const last = rps.rounds[rps.rounds.length - 1];
    if (!rps.starter) {
      $count.textContent = 'Empate!';
      $msg.textContent = `${3 - rps.rounds.length} ${rps.rounds.length === 2 ? 'chance' : 'chances'} antes do sorteio. De novo.`;
      picks = { X: null, O: null }; picking = 'X';
      await sleep(1300); $count.textContent = ''; askPick(); return;
    }
    S.starter = rps.starter;
    $count.textContent = rps.bySortition ? 'Sorteio!' : `${n[rps.starter]} venceu`;
    $msg.textContent = rps.bySortition ? `Três empates seguidos. No sorteio, ${n[rps.starter]} atira primeiro.`
      : `${HAND_LABEL[last.result === 'X' ? last.x : last.o]} ganha de ${HAND_LABEL[last.result === 'X' ? last.o : last.x].toLowerCase()}. ${n[rps.starter]} atira primeiro.`;
    $bar.style.width = '0%';
    document.getElementById('hands').hidden = true;
    const b = document.getElementById('begin'); b.hidden = false; b.focus();
    b.onclick = () => startGame(S.starter);
  }
  askPick();
}

// ---------- Partida ----------
function startGame(starter) {
  clear();
  S.games++;
  S.starter = starter;
  const c = S.conf;
  S.g = c.kind === 'ult' ? E.newUltimateGame(starter) : E.newLineGame(c.mode, starter);
  S.clock = { X: c.secs * 1000, O: c.secs * 1000 };
  S.last = null; S.over = false; S.thinking = false;
  renderGame();
  let prev = performance.now();
  timer = setInterval(() => {
    const now = performance.now(); const dt = now - prev; prev = now;
    if (S.over) return;
    S.clock[S.g.turn] -= dt;
    if (S.clock[S.g.turn] <= 0) { S.clock[S.g.turn] = 0; finish(S.g.turn === 'X' ? 'O' : 'X', 'tempo'); }
    paintClocks();
  }, 100);
  maybeBot();
}

const fmt = (ms) => { const s = Math.ceil(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };

function renderGame() {
  const n = names(), c = S.conf;
  const series = S.modeKey === 'classico' && !S.online;
  $app.innerHTML = `
    <div class="topbar"><button class="link" id="quit" type="button">Desistir</button><span class="display">${c.label}</span></div>
    <div class="hud">
      <div class="plate x" id="px"><div class="name">${n.X}</div><div class="fuse"><i id="fx"></i><b id="bx"></b></div><div class="clock" id="cx"></div></div>
      <div class="score">${series ? `${S.wins.X} – ${S.wins.O}<small>Partida ${S.games}${cfg.vs === 'bot' ? ' · ' + LEVELS[cfg.level] : ''}</small>` : `<small>${S.online ? 'Online' : cfg.vs === 'bot' ? 'Bot ' + LEVELS[cfg.level].toLowerCase() : 'Partida única'}</small>`}</div>
      <div class="plate o" id="po"><div class="name">${n.O}</div><div class="fuse"><i id="fo"></i><b id="bo"></b></div><div class="clock" id="co"></div></div>
    </div>
    <div class="status" id="status" aria-live="polite"></div>
    <div class="table" id="table"></div>`;
  document.getElementById('quit').onclick = () => { if (S.over) return; if (S.online) Online.send({ acao: 'desistir' }); else finish('O', 'desistência', true); };
  drawBoard();
  paintClocks();
}

function paintClocks() {
  if (!S || !document.getElementById('px')) return;
  const total = S.conf.secs * 1000;
  for (const p of ['X', 'O']) {
    const k = p.toLowerCase();
    const frac = Math.max(0, S.clock[p] / total);
    const plate = document.getElementById('p' + k);
    plate.classList.toggle('active', !S.over && S.g.turn === p);
    plate.classList.toggle('low', S.clock[p] < 10000);
    document.getElementById('f' + k).style.width = (frac * 100) + '%';
    const spark = document.getElementById('b' + k);
    spark.style.left = p === 'X' ? (frac * 100) + '%' : (100 - frac * 100) + '%';
    document.getElementById('c' + k).textContent = fmt(S.clock[p]);
  }
}

function statusText() {
  const n = names();
  if (S.over) return '';
  if (S.thinking) return `${n.O} está mirando…`;
  if (S.online && S.g.turn !== S.you) return 'O adversário está mirando…';
  if (S.online && S.conf.kind !== 'ult') return 'Sua vez. Escolha onde atirar.';
  if (S.conf.kind === 'ult') {
    const where = S.g.next === null ? 'em qualquer tabuleiro aberto' : 'no tabuleiro destacado';
    return cfg.vs === 'bot' || S.online ? `Sua vez: atire ${where}.` : `Vez de ${n[S.g.turn]}: atire ${where}.`;
  }
  return cfg.vs === 'bot' ? 'Sua vez. Escolha onde atirar.' : `Vez de ${n[S.g.turn]}.`;
}

function canHumanPlay() { return !S.over && !S.thinking && !S.sending && !isBot(S.g.turn) && (!S.online || S.g.turn === S.you); }

function cellHtml(p, idx, attrs, isLast, isWin, enabled) {
  const cls = ['cell', isLast ? 'shot last-' + p.toLowerCase() : '', isWin ? 'win' : ''].join(' ');
  return `<button type="button" class="${cls}" ${attrs} ${enabled ? '' : 'disabled'} aria-label="${p ? 'Casa marcada por ' + p : 'Atirar aqui'}">${p ? markSvg(p) : ''}</button>`;
}

function drawBoard() {
  const t = document.getElementById('table'); if (!t) return;
  const g = S.g, live = canHumanPlay();
  document.getElementById('status').textContent = statusText();
  if (S.conf.kind === 'line') {
    const n = g.mode.size, win = new Set(g.winLine || []);
    const dense = n > 5;
    t.innerHTML = `<div class="board ${dense ? 'dense' : ''}" id="board" style="--n:${n};--gap:${n > 5 ? '2px' : '6px'}">` +
      g.cells.map((p, i) => cellHtml(p, i, `data-i="${i}"`, S.last === i, win.has(i), live && !p)).join('') + '</div>';
    t.querySelectorAll('.cell').forEach((b) => b.onclick = () => human(+b.dataset.i));
  } else {
    const legal = new Set(E.legalUltimateMoves(g).map((m) => m.board));
    const winB = new Set(g.winLine || []);
    t.innerHTML = '<div class="ult" id="board">' + g.boards.map((cells, b) => {
      const decided = g.macro[b];
      const cls = ['board', !g.winner && legal.has(b) ? 'live' : (!g.winner && !decided ? 'idle' : ''), winB.has(b) ? 'wonline' : ''].join(' ');
      const big = decided ? `<div class="big">${decided === 'draw' ? '<span class="display" style="color:var(--muted);font-size:1.4rem">Empate</span>' : markSvg(decided)}</div>` : '';
      return `<div class="${cls}" style="--n:3">` + cells.map((p, i) =>
        cellHtml(p, i, `data-b="${b}" data-i="${i}"`, S.last && S.last.board === b && S.last.cell === i, false, live && !p && !decided && legal.has(b))).join('') + big + '</div>';
    }).join('') + '</div>';
    t.querySelectorAll('.cell').forEach((b) => b.onclick = () => human({ board: +b.dataset.b, cell: +b.dataset.i }));
  }
}

function shake() { const b = document.getElementById('board'); if (!b) return; b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); }

function apply(move) {
  S.g = S.conf.kind === 'ult' ? E.playUltimate(S.g, move) : E.playLine(S.g, move);
  S.last = move;
  bang(); buzz(25);
  drawBoard(); shake(); paintClocks();
  if (S.g.winner) setTimeout(() => finish(S.g.winner, 'linha'), 80);
}

function human(move) {
  if (!canHumanPlay()) return;
  if (S.online) { Online.move(move); return; }
  try { apply(move); } catch { return; }
  maybeBot();
}

async function maybeBot() {
  if (S.over || !isBot(S.g.turn)) return;
  S.thinking = true; drawBoard();
  await sleep(450 + Math.random() * 350);
  if (!S || S.over) return;
  const mv = S.conf.kind === 'ult' ? E.ultimateBotMove(S.g, cfg.level) : E.lineBotMove(S.g, cfg.level);
  S.thinking = false;
  apply(mv);
}

function finish(winner, how, quit = false) {
  if (S.over) return;
  S.over = true; clear(); S.thinking = false;
  drawBoard(); paintClocks();
  if (winner !== 'draw') { S.wins[winner]++; bang(true); buzz([40, 60, 80]); }
  const n = names();
  const series = S.modeKey === 'classico' && !quit;
  const seriesDone = !series || S.wins.X >= 2 || S.wins.O >= 2 || S.games >= 5;
  let title, line;
  if (winner === 'draw') { title = 'Empate'; line = 'Ninguém fechou a linha. Pólvora gasta à toa.'; }
  else {
    title = cfg.vs === 'bot' ? (winner === 'X' ? 'Você venceu!' : 'O Bandido venceu') : `${n[winner]} venceu!`;
    line = how === 'tempo' ? `O pavio de ${n[winner === 'X' ? 'O' : 'X']} queimou até o fim.`
      : how === 'desistência' ? 'Desistência. O duelo acabou antes da hora.'
      : 'Três tiros em linha. Duelo resolvido.';
  }
  if (series) {
    line += ` Placar da série: ${S.wins.X} a ${S.wins.O}.`;
    if (seriesDone) {
      const champ = S.wins.X === S.wins.O ? null : S.wins.X > S.wins.O ? 'X' : 'O';
      title = champ ? `${n[champ]} levou a série` : 'Série empatada';
    }
  }
  const next = series && !seriesDone;
  const o = document.createElement('div');
  o.className = 'overlay';
  o.innerHTML = `<div class="poster">
      <h2>${title}</h2><p>${line}</p>
      ${next ? `<p><strong>${n[S.starter === 'X' ? 'O' : 'X']}</strong> atira primeiro na próxima.</p>` : ''}
      <div class="row">
        ${next ? '<button class="cta" id="nx" type="button">Próxima partida</button>' : '<button class="cta" id="again" type="button">Revanche</button>'}
        <button class="cta ghost" id="tomenu" type="button">Menu</button>
      </div></div>`;
  setTimeout(() => {
    $app.appendChild(o);
    const nx = document.getElementById('nx'), ag = document.getElementById('again');
    if (nx) { nx.onclick = () => { o.remove(); startGame(S.starter === 'X' ? 'O' : 'X'); }; nx.focus(); }
    if (ag) { ag.onclick = () => { o.remove(); startSeries(); }; ag.focus(); }
    document.getElementById('tomenu').onclick = () => { o.remove(); menu(); };
  }, winner === 'draw' ? 300 : 900);
}

/*ONLINE*/

if (!Online.boot()) menu();
})();
</script>
